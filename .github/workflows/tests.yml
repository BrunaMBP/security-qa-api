name: Testes e Seguranca

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: pytest -v

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: pip install bandit pip-audit

      - name: Análise estática (Bandit)
        run: bandit -r app.py database.py

      - name: Vulnerabilidades em dependências (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    needs: [pytest, seguranca]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: security-qa-api:latest

      - name: Scan de vulnerabilidades na Imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "security-qa-api:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"