name: Testes e Seguranca

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: pytest -v

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: pip install bandit pip-audit

      - name: Análise estática (Bandit)
        run: bandit -r app.py database.py

      - name: Vulnerabilidades em dependências (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    needs: [pytest, seguranca]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t security-qa-api:latest .

      - name: Scan de vulnerabilidades na imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "security-qa-api:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Subir o container
        run: docker run -d --name sqa -p 127.0.0.1:5000:5000 security-qa-api:latest

      - name: Testar o login no container
        run: |
          for i in $(seq 1 15); do
            curl -sf -X POST http://127.0.0.1:5000/login -H "Content-Type: application/json" -d '{"username":"admin","password":"admin123"}' && exit 0
            sleep 2
          done
          echo "API não respondeu a tempo"
          exit 1

      - name: Mostrar logs do container (se falhar)
        if: failure()
        run: docker logs sqa